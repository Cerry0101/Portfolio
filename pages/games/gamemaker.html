<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>GM</title>

  <link rel="stylesheet" href="../../style.css">
</head>

<body>

  <div class="game-container">

    <!-- HEADER -->

      <a href="../games.html" class="back-btn">⬅ Voltar</a>
      <h1>🎮 Jogo do Gamemaker</h1>
    </div>

    <!-- CONTEÚDO -->
    <div class="game-content">

      <!-- ESQUERDA -->
      <div class="game-left">
        <img src="../../assets/games/logo_gm.png" alt="Capa do jogo">

      <div class="game-right">

        <p class="game-desc">
          Casos mais curiosos ainda que os anteriores
        </p>

           Trata-se de uma versão beta já funcional, criada para o desktop,

          <p><strong>Engine:</strong> Gamemaker</p>

          <p><strong>Tipo:</strong> Click</p>

        </a>

      </div>

    <div style="position:relative;width:100%;max-width:1200px;margin:0 auto;padding-bottom:56.25%;overflow:hidden;">
        <iframe
            style="
                position:absolute;
                top:-5%;
                left:-15%;
                width:130%;
                height:110%;
                border:0;
            "
            src="https://gamaker-portfolio.netlify.app/"
            allowfullscreen>
        </iframe>
    </div>

    <!-- FOOTER -->
    <div class="footer">
